<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Constructora ABC</title>
        <meta name="description" content="Constructora ABC">
        <meta name="author" content="Andres Felipe Baylon Morales">
        <link rel="icon" href="IMG/logo.png" sizes="32x32">
        <link rel="icon" href="IMG/logo.png" sizes="16x16">
        <link rel="stylesheet" href="CSS/default.css">
        <script src="JS/login.js" defer></script>
    </head>
    <body>
        <header>
            <img class="logo" src="IMG/logo.png" alt="Constructora ABC">
            <h1>Constructora ABC</h1>
        </header>
        <main>
            <form class="form-login" action="" method="post">
                <h2>Inicio de sesión</h2>
                <label for="Usuario">Usuario:</label>
                <input class="input" type="text" id="Usuario" name="Usuario" placeholder="Usuario" required>
                <label for="Contrasena">Contraseña:</label>
                <input class="input" type="password" id="Contrasena" name="Contrasena" placeholder="Contrasena" required>
                <input class="btn" type="submit" value="Ingresar">
                <p><a href="registro.html">¿No tienes una cuenta? Registrate</a></p>
                <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
            </form>
        </main>
        <footer>
            <small>Constructora ABC &copy; 2026</small>
        </footer>
    </body>
</html>
