<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Constructora ABC - Pintura</title>
        <link rel="icon" href="IMG/logo.png" sizes="32x32">
        <link rel="icon" href="IMG/logo.png" sizes="16x16">
        <link rel="stylesheet" href="CSS/default.css">
        <script src="JS/pintura.js" defer></script>
    </head>
    <body>
        <header>
            <img class="logo" src="IMG/logo.png" alt="Constructora ABC">
            <h1>Constructora ABC</h1>
        </header>
        <main>
            <form class="form-login" action="" method="post">
                <h2>Pintura</h2>
                <label for="Superficie">Superficie del muro (m²):</label>
                <input class="input" type="number" id="Superficie" name="Superficie" placeholder="50.00" step="0.01" required>
                <p style="font-size:0.85rem; color:#93A0A8; margin-top:8px;">(Rendimiento: 6 m² por litro)</p>
                <input class="btn" type="submit" value="Calcular">
                <div class="resultados" id="resultados">
                    <h3>Resultados</h3>
                    <div class="fila-resultado"><span>Pintura necesaria:</span><span id="resPintura"></span></div>
                </div>
                <p><a href="menu.html">← Volver al menú</a></p>
            </form>
        </main>
        <footer>
            <small>Constructora ABC &copy; 2026</small>
        </footer>
    </body>
</html>
