<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Constructora ABC - Techo</title>
        <link rel="icon" href="IMG/logo.png" sizes="32x32">
        <link rel="icon" href="IMG/logo.png" sizes="16x16">
        <link rel="stylesheet" href="CSS/default.css">
        <script src="JS/techo.js" defer></script>
    </head>
    <body>
        <header>
            <img class="logo" src="IMG/logo.png" alt="Constructora ABC">
            <h1>Constructora ABC</h1>
        </header>
        <main>
            <form class="form-login" action="" method="post">
                <h2>Techo</h2>
                <label for="Espesor">Espesor (m):</label>
                <input class="input" type="number" id="Espesor" name="Espesor" placeholder="0.15" step="0.01" required>
                <label for="Ancho">Ancho (m):</label>
                <input class="input" type="number" id="Ancho" name="Ancho" placeholder="6.00" step="0.01" required>
                <label for="Largo">Largo (m):</label>
                <input class="input" type="number" id="Largo" name="Largo" placeholder="10.00" step="0.01" required>
                <input class="btn" type="submit" value="Calcular">
                <div class="resultados" id="resultados">
                    <h3>Resultados</h3>
                    <div class="fila-resultado"><span>Superficie:</span><span id="resSuperficie"></span></div>
                    <div class="fila-resultado"><span>Cemento:</span><span id="resCemento"></span></div>
                    <div class="fila-resultado"><span>Arena:</span><span id="resArena"></span></div>
                    <div class="fila-resultado"><span>Piedra:</span><span id="resPiedra"></span></div>
                    <div class="fila-resultado"><span>Hierro del 8:</span><span id="resHierro8"></span></div>
                    <div class="fila-resultado"><span>Hierro del 6:</span><span id="resHierro6"></span></div>
                </div>
                <p><a href="menu.html">← Volver al menú</a></p>
            </form>
        </main>
        <footer>
            <small>Constructora ABC &copy; 2026</small>
        </footer>
    </body>
</html>
